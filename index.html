<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MatrixCode — Online Compiler</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.44.0/min/vs/loader.min.js"></script>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --g:    #00ff41;
      --gdim: #00cc34;
      --gdark:#003b0f;
      --glow: #00ff4133;
      --bg:   #020d04;
      --bg2:  #071409;
      --bg3:  #0a1f0d;
      --bdr:  #0f3a14;
      --txt:  #c8ffc8;
      --dim:  #4a8050;
      --red:  #ff4141;
      --yel:  #ffe041;
      --blu:  #41c8ff;
      --r:    6px;
      --ph:   54px;
    }
    html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:'Consolas','Courier New',monospace}

    /* ─── MATRIX RAIN ─── */
    #rain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.07}

    /* ─── HEADER ─── */
    header{
      position:fixed;top:0;left:0;right:0;height:var(--ph);
      background:#020d04ee;border-bottom:1px solid var(--bdr);
      display:flex;align-items:center;padding:0 16px;gap:10px;
      z-index:200;backdrop-filter:blur(8px);
    }
    .logo{font-size:1.2rem;font-weight:700;letter-spacing:3px;color:var(--g);
      text-shadow:0 0 14px var(--g);white-space:nowrap;display:flex;align-items:center;gap:8px}
    .logo-sym{font-size:1.5rem;animation:logopulse 2s ease-in-out infinite}
    @keyframes logopulse{0%,100%{text-shadow:0 0 8px var(--g)}50%{text-shadow:0 0 28px var(--g),0 0 50px var(--g)}}

    .hbar{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}

    select.qs{
      background:var(--bg3);color:var(--g);border:1px solid var(--bdr);
      border-radius:var(--r);padding:6px 10px;font-family:inherit;font-size:.83rem;
      cursor:pointer;outline:none;max-width:210px;
      box-shadow:0 0 8px var(--glow);transition:.2s;
    }
    select.qs:focus,select.qs:hover{border-color:var(--g);box-shadow:0 0 14px var(--glow)}
    optgroup{color:var(--dim)}

    .btn{display:inline-flex;align-items:center;gap:5px;padding:6px 14px;border-radius:var(--r);
      font-family:inherit;font-size:.8rem;cursor:pointer;border:1px solid;transition:.18s;
      font-weight:700;letter-spacing:.5px;white-space:nowrap}
    .btn:active{transform:scale(.97)}

    .b-run{background:var(--gdark);color:var(--g);border-color:var(--g);box-shadow:0 0 10px var(--glow)}
    .b-run:hover:not(:disabled){background:var(--g);color:var(--bg);box-shadow:0 0 24px var(--g)}
    .b-run:disabled{opacity:.4;cursor:not-allowed}

    .b-sav{color:var(--yel);border-color:#554d00;background:#111000}
    .b-sav:hover{background:var(--yel);color:#111000;box-shadow:0 0 14px #ffe04166}

    .b-dl{color:var(--blu);border-color:#004466;background:#001520}
    .b-dl:hover{background:var(--blu);color:#001520;box-shadow:0 0 14px #41c8ff44}

    .b-gh{color:var(--dim);border-color:var(--bdr);background:transparent}
    .b-gh:hover{color:var(--g);border-color:var(--gdim)}

    /* ─── LAYOUT ─── */
    #app{
      position:fixed;top:var(--ph);left:0;right:0;bottom:28px;
      display:flex;z-index:1;
    }

    /* ─── LANG PANEL ─── */
    #lp{
      width:280px;background:var(--bg2);border-right:1px solid var(--bdr);
      display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;
      transition:width .22s ease;
    }
    #lp.shut{width:0}
    .ph{
      padding:10px 12px;border-bottom:1px solid var(--bdr);
      font-size:.7rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;
      display:flex;align-items:center;justify-content:space-between;
    }
    .ph b{color:var(--g)}
    #ls{
      margin:8px;padding:7px 10px;
      background:var(--bg3);border:1px solid var(--bdr);border-radius:var(--r);
      color:var(--g);font-family:inherit;font-size:.82rem;outline:none;
    }
    #ls:focus{border-color:var(--g);box-shadow:0 0 6px var(--glow)}
    #ls::placeholder{color:var(--dim)}

    #ll{flex:1;overflow-y:auto;padding:2px 0 8px}
    #ll::-webkit-scrollbar{width:3px}
    #ll::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

    .cat{padding:6px 12px 2px;font-size:.65rem;letter-spacing:1.5px;
      color:var(--dim);text-transform:uppercase;border-top:1px solid var(--bdr);margin-top:4px}
    .li{
      padding:8px 12px;display:flex;align-items:center;gap:9px;
      cursor:pointer;transition:background .13s;font-size:.83rem;
    }
    .li:hover{background:var(--gdark);color:var(--g)}
    .li.on{background:var(--gdark);color:var(--g);border-left:3px solid var(--g);padding-left:9px;
      box-shadow:inset 0 0 12px var(--glow)}
    .li-ico{font-size:1rem;min-width:20px;text-align:center}
    .li-ver{font-size:.63rem;color:var(--dim);margin-left:auto;white-space:nowrap}
    .li-badge{font-size:.55rem;padding:1px 5px;border-radius:3px;
      background:var(--gdark);color:var(--g);border:1px solid var(--bdr)}

    /* loading skeleton */
    .skel{height:32px;margin:4px 12px;border-radius:4px;
      background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 50%,var(--bg2) 75%);
      background-size:200% 100%;animation:skel 1.5s infinite}
    @keyframes skel{0%{background-position:200%}100%{background-position:-200%}}

    /* ─── EDITOR AREA ─── */
    #ea{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}

    #tb{
      display:flex;align-items:center;background:var(--bg2);
      border-bottom:1px solid var(--bdr);padding:0 8px;height:38px;gap:3px;overflow-x:auto;
    }
    #tb::-webkit-scrollbar{height:2px}
    #tb::-webkit-scrollbar-thumb{background:var(--bdr)}
    .tab{
      padding:5px 12px;border:1px solid transparent;border-radius:4px 4px 0 0;
      font-size:.78rem;color:var(--dim);cursor:pointer;white-space:nowrap;
      display:flex;align-items:center;gap:6px;transition:.13s;flex-shrink:0;
    }
    .tab.on{background:var(--bg3);color:var(--g);border-color:var(--bdr);border-bottom-color:var(--bg3)}
    .tab-x{font-size:.65rem;opacity:.45;margin-left:2px}
    .tab-x:hover{opacity:1;color:var(--red)}
    #ntb{
      margin-left:auto;padding:3px 9px;background:transparent;
      border:1px dashed var(--bdr);color:var(--dim);border-radius:4px;
      cursor:pointer;font-size:.78rem;font-family:inherit;flex-shrink:0;
    }
    #ntb:hover{border-color:var(--g);color:var(--g)}

    #ec{flex:1;position:relative;overflow:hidden}
    #me{width:100%;height:100%}

    #stdinbar{
      background:var(--bg2);border-top:1px solid var(--bdr);
      padding:5px 12px;display:flex;align-items:center;gap:8px;font-size:.76rem;
    }
    #stdinbar label{color:var(--dim);white-space:nowrap}
    #si{
      flex:1;background:var(--bg);border:1px solid var(--bdr);color:var(--txt);
      padding:4px 8px;border-radius:var(--r);font-family:inherit;font-size:.78rem;
    }
    #si:focus{outline:none;border-color:var(--gdim)}

    /* ─── OUTPUT ─── */
    #op{
      width:380px;display:flex;flex-direction:column;background:var(--bg2);
      border-left:1px solid var(--bdr);overflow:hidden;flex-shrink:0;
    }
    .oph{
      padding:9px 12px;border-bottom:1px solid var(--bdr);font-size:.7rem;
      letter-spacing:2px;text-transform:uppercase;color:var(--dim);
      display:flex;align-items:center;gap:9px;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
    .dot.run{background:var(--yel);box-shadow:0 0 8px var(--yel);animation:dp .7s infinite alternate}
    .dot.ok {background:var(--g);box-shadow:0 0 8px var(--g)}
    .dot.err{background:var(--red);box-shadow:0 0 8px var(--red)}
    @keyframes dp{from{opacity:1}to{opacity:.25}}

    .otabs{display:flex;border-bottom:1px solid var(--bdr)}
    .ot{
      flex:1;padding:7px;text-align:center;font-size:.72rem;
      color:var(--dim);cursor:pointer;transition:.13s;letter-spacing:1px;
    }
    .ot.on{color:var(--g);border-bottom:2px solid var(--g);background:var(--bg3)}
    .ot:hover{color:var(--gdim)}

    #oc{flex:1;overflow-y:auto;position:relative}
    #oc::-webkit-scrollbar{width:3px}
    #oc::-webkit-scrollbar-thumb{background:var(--bdr)}
    .opane{display:none;padding:12px;font-size:.81rem;line-height:1.75;white-space:pre-wrap;word-break:break-all;height:100%}
    .opane.on{display:block}
    #po-out{color:var(--g)}
    #po-err{color:var(--red)}
    #po-inf{color:var(--dim)}
    .empty-hint{color:var(--dim);text-align:center;margin-top:36px;font-size:.82rem;opacity:.7}

    .statrow{
      display:flex;gap:12px;padding:8px 12px;border-top:1px solid var(--bdr);
      font-size:.72rem;color:var(--dim);flex-wrap:wrap;
    }
    .sv{color:var(--g);font-weight:700}

    /* ─── RESIZERS ─── */
    .rz{width:5px;background:transparent;cursor:col-resize;transition:background .18s;flex-shrink:0}
    .rz:hover,.rz.drag{background:var(--g)}

    /* ─── TOAST ─── */
    #toast{
      position:fixed;bottom:36px;right:24px;z-index:9999;
      padding:9px 18px;border-radius:var(--r);font-size:.8rem;
      box-shadow:0 0 18px var(--glow);pointer-events:none;
      opacity:0;transform:translateY(8px);transition:.28s;
    }
    #toast.show{opacity:1;transform:translateY(0)}

    /* ─── MODAL ─── */
    .mo{
      position:fixed;inset:0;background:#000000bb;z-index:500;
      display:flex;align-items:center;justify-content:center;
      opacity:0;pointer-events:none;transition:opacity .2s;
    }
    .mo.open{opacity:1;pointer-events:all}
    .mb{
      background:var(--bg2);border:1px solid var(--bdr);border-radius:10px;
      padding:26px 30px;min-width:360px;max-width:90vw;
      box-shadow:0 0 40px var(--glow);
    }
    .mt{font-size:.95rem;color:var(--g);letter-spacing:2px;margin-bottom:16px;text-transform:uppercase}
    .mb label{font-size:.74rem;color:var(--dim);display:block;margin-bottom:4px}
    .mb input{
      width:100%;background:var(--bg);border:1px solid var(--bdr);border-radius:var(--r);
      color:var(--g);padding:7px 10px;font-family:inherit;font-size:.82rem;margin-bottom:12px;
    }
    .mb input:focus{outline:none;border-color:var(--g)}
    .macts{display:flex;gap:8px;margin-top:4px}

    /* ─── STATUS BAR ─── */
    #sbar{
      position:fixed;bottom:0;left:0;right:0;height:28px;
      background:var(--bg2);border-top:1px solid var(--bdr);
      display:flex;align-items:center;gap:20px;padding:0 14px;
      font-size:.67rem;color:var(--dim);z-index:200;
    }
    #sbar kbd{
      background:var(--bg3);border:1px solid var(--bdr);
      padding:0 4px;border-radius:3px;color:var(--g);font-family:inherit;font-size:.65rem;
    }
    #sbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}

    /* spinner */
    .sp{display:inline-block;width:13px;height:13px;border:2px solid var(--gdark);
      border-top-color:var(--g);border-radius:50%;animation:spin .55s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* scrollbar global */
    ::-webkit-scrollbar{width:5px;height:5px}
    ::-webkit-scrollbar-track{background:var(--bg)}
    ::-webkit-scrollbar-thumb{background:var(--bdr);border-radius:3px}

    @media(max-width:860px){
      #op{display:none}
      #lp{width:240px}
    }
  </style>
</head>
<body>

<canvas id="rain"></canvas>

<!-- ═══ HEADER ═══ -->
<header>
  <div class="logo"><span class="logo-sym">⬡</span> MATRIX<span style="color:var(--dim);font-weight:300">CODE</span></div>

  <div class="hbar">
    <button class="btn b-gh" id="togLang" title="Toggle language panel (Ctrl+L)">☰</button>
    <select class="qs" id="qs" title="Quick-switch language"></select>
    <button class="btn b-run" id="runBtn"><span id="ri">▶</span><span id="rt">RUN</span></button>
  </div>

  <div style="display:flex;gap:7px;align-items:center">
    <button class="btn b-sav" id="savBtn">💾 SAVE</button>
    <button class="btn b-dl"  id="dlBtn" >⬇ DOWNLOAD</button>
    <button class="btn b-gh"  id="cfgBtn">⚙</button>
  </div>
</header>

<!-- ═══ APP ═══ -->
<div id="app">

  <!-- LANG PANEL -->
  <div id="lp">
    <div class="ph"><span>// <b>LANGUAGES</b></span><span id="lc" style="font-weight:400"></span></div>
    <input type="text" id="ls" placeholder="🔍 Search…" autocomplete="off"/>
    <div id="ll">
      <!-- skeletons while loading -->
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
      <div class="skel"></div><div class="skel"></div><div class="skel"></div>
    </div>
  </div>

  <div class="rz" id="rzL"></div>

  <!-- EDITOR -->
  <div id="ea">
    <div id="tb"><button id="ntb">＋ New Tab</button></div>
    <div id="ec"><div id="me"></div></div>
    <div id="stdinbar">
      <label>STDIN ›</label>
      <input type="text" id="si" placeholder="Optional stdin for your program…"/>
    </div>
  </div>

  <div class="rz" id="rzR"></div>

  <!-- OUTPUT -->
  <div id="op">
    <div class="oph"><div class="dot" id="dot"></div><span id="stxt">READY</span></div>
    <div class="otabs">
      <div class="ot on" data-p="out">STDOUT</div>
      <div class="ot"    data-p="err">STDERR</div>
      <div class="ot"    data-p="inf">INFO</div>
    </div>
    <div id="oc">
      <div class="opane on" id="po-out"><span class="empty-hint">// output will appear here…</span></div>
      <div class="opane"    id="po-err"></div>
      <div class="opane"    id="po-inf"></div>
    </div>
    <div class="statrow" id="sr" style="display:none">
      <span>Exit: <span class="sv" id="sx">—</span></span>
      <span>Signal: <span class="sv" id="ss">—</span></span>
      <span id="st-api" style="margin-left:auto;font-size:.65rem">Wandbox API</span>
    </div>
  </div>
</div>

<!-- STATUS BAR -->
<div id="sbar">
  <span><kbd>Ctrl+Enter</kbd> Run</span>
  <span><kbd>Ctrl+S</kbd> Save</span>
  <span><kbd>Ctrl+D</kbd> Download</span>
  <span><kbd>Ctrl+T</kbd> New Tab</span>
  <span><kbd>Ctrl+L</kbd> Lang Panel</span>
  <div id="sbar-right">
    <span id="sb-lang" style="color:var(--g)">—</span>
    <span id="sb-info">Wandbox · Free · No key needed</span>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- SETTINGS MODAL -->
<div class="mo" id="mo">
  <div class="mb">
    <div class="mt">// Settings</div>
    <label>Font Size (px)</label>
    <input type="number" id="cf" value="14" min="10" max="28"/>
    <label>Tab Size (spaces)</label>
    <input type="number" id="ct" value="4"  min="2"  max="8"/>
    <label>Word Wrap</label>
    <input type="text"   id="cw" value="on" placeholder="on / off"/>
    <div class="macts">
      <button class="btn b-run" id="mo-ok">APPLY</button>
      <button class="btn b-gh"  id="mo-x" >CANCEL</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ═══════════════════════════════════════════════════
//  MATRIX RAIN
// ═══════════════════════════════════════════════════
;(()=>{
  const cv=document.getElementById('rain'),cx=cv.getContext('2d');
  const ch='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789{}[]<>=+-*/|;:.!@#$%^&~?01';
  let cols,drops;
  const res=()=>{cv.width=innerWidth;cv.height=innerHeight;cols=~~(cv.width/16);drops=Array(cols).fill(1)};
  res(); window.addEventListener('resize',res);
  setInterval(()=>{
    cx.fillStyle='rgba(2,13,4,.06)'; cx.fillRect(0,0,cv.width,cv.height);
    cx.fillStyle='#00ff41'; cx.font='13px monospace';
    drops.forEach((y,i)=>{
      cx.fillText(ch[~~(Math.random()*ch.length)],i*16,y*16);
      if(y*16>cv.height&&Math.random()>.975)drops[i]=0;
      drops[i]++;
    });
  },45);
})();

// ═══════════════════════════════════════════════════
//  LANGUAGE CATALOGUE  (Wandbox compiler mapping)
//  Each entry: { name, icon, cat, compiler, ext, monacoLang, template }
//  "compiler" must match a name from Wandbox /api/list.json
// ═══════════════════════════════════════════════════
const CATALOG = [
  // ── Scripting ─────────────────────────────────
  { name:'Python 3',    icon:'🐍', cat:'Scripting', compiler:'cpython-head',      ext:'py',    mono:'python',      tpl:'# Python 3\nprint("Hello, Matrix!")\n' },
  { name:'Python 2',    icon:'🐍', cat:'Scripting', compiler:'cpython-2.7-head',  ext:'py',    mono:'python',      tpl:'print "Hello, Matrix!"\n' },
  { name:'Ruby',        icon:'💎', cat:'Scripting', compiler:'ruby-head',         ext:'rb',    mono:'ruby',        tpl:'puts "Hello, Matrix!"\n' },
  { name:'PHP',         icon:'🐘', cat:'Scripting', compiler:'php-head',          ext:'php',   mono:'php',         tpl:'<?php\necho "Hello, Matrix!\\n";\n' },
  { name:'Perl',        icon:'🐪', cat:'Scripting', compiler:'perl-head',         ext:'pl',    mono:'perl',        tpl:'print "Hello, Matrix!\\n";\n' },
  { name:'Lua',         icon:'🌙', cat:'Scripting', compiler:'lua-head',          ext:'lua',   mono:'lua',         tpl:'print("Hello, Matrix!")\n' },
  // ── Web ───────────────────────────────────────
  { name:'JavaScript',  icon:'🟨', cat:'Web',       compiler:'nodejs-head',       ext:'js',    mono:'javascript',  tpl:'// Node.js\nconsole.log("Hello, Matrix!");\n' },
  { name:'TypeScript',  icon:'🔷', cat:'Web',       compiler:'typescript-head',   ext:'ts',    mono:'typescript',  tpl:'const msg: string = "Hello, Matrix!";\nconsole.log(msg);\n' },
  { name:'CoffeeScript',icon:'☕', cat:'Web',       compiler:'coffeescript-head', ext:'coffee',mono:'coffeescript', tpl:'console.log "Hello, Matrix!"\n' },
  // ── Systems ───────────────────────────────────
  { name:'C (GCC)',     icon:'🔵', cat:'Systems',   compiler:'gcc-head',          ext:'c',     mono:'c',           tpl:'#include <stdio.h>\nint main() {\n  printf("Hello, Matrix!\\n");\n  return 0;\n}\n',
    opts:['--std=c11','--pedantic-errors'] },
  { name:'C (Clang)',   icon:'🔵', cat:'Systems',   compiler:'clang-head',        ext:'c',     mono:'c',           tpl:'#include <stdio.h>\nint main() {\n  printf("Hello, Matrix!\\n");\n  return 0;\n}\n',
    opts:['--std=c11'] },
  { name:'C++',         icon:'🔵', cat:'Systems',   compiler:'gcc-head',          ext:'cpp',   mono:'cpp',         tpl:'#include <iostream>\nusing namespace std;\nint main() {\n  cout << "Hello, Matrix!" << endl;\n  return 0;\n}\n' },
  { name:'C++ (Clang)', icon:'🔵', cat:'Systems',   compiler:'clang-head',        ext:'cpp',   mono:'cpp',         tpl:'#include <iostream>\nusing namespace std;\nint main() {\n  cout << "Hello, Matrix!" << endl;\n  return 0;\n}\n' },
  { name:'D',           icon:'🔷', cat:'Systems',   compiler:'dmd-head',          ext:'d',     mono:'plaintext',   tpl:'import std.stdio;\nvoid main() {\n  writeln("Hello, Matrix!");\n}\n' },
  { name:'Rust',        icon:'🦀', cat:'Systems',   compiler:'rust-head',         ext:'rs',    mono:'rust',        tpl:'fn main() {\n  println!("Hello, Matrix!");\n}\n' },
  { name:'Go',          icon:'🐹', cat:'Systems',   compiler:'go-head',           ext:'go',    mono:'go',          tpl:'package main\nimport "fmt"\nfunc main() {\n  fmt.Println("Hello, Matrix!")\n}\n' },
  { name:'Nim',         icon:'👑', cat:'Systems',   compiler:'nim-head',          ext:'nim',   mono:'plaintext',   tpl:'echo "Hello, Matrix!"\n' },
  // ── JVM ───────────────────────────────────────
  { name:'Java',        icon:'☕', cat:'JVM',       compiler:'openjdk-head',      ext:'java',  mono:'java',        tpl:'public class Main {\n  public static void main(String[] args) {\n    System.out.println("Hello, Matrix!");\n  }\n}\n' },
  { name:'Scala',       icon:'🔴', cat:'JVM',       compiler:'scala-head',        ext:'scala', mono:'scala',       tpl:'object Main extends App {\n  println("Hello, Matrix!")\n}\n' },
  { name:'Kotlin',      icon:'🟣', cat:'JVM',       compiler:'kotlin-head',       ext:'kt',    mono:'kotlin',      tpl:'fun main() {\n  println("Hello, Matrix!")\n}\n' },
  { name:'Groovy',      icon:'🎸', cat:'JVM',       compiler:'groovy-head',       ext:'groovy',mono:'groovy',      tpl:'println "Hello, Matrix!"\n' },
  // ── .NET ──────────────────────────────────────
  { name:'C#',          icon:'🟣', cat:'.NET',      compiler:'mono-head',         ext:'cs',    mono:'csharp',      tpl:'using System;\nclass Program {\n  static void Main() {\n    Console.WriteLine("Hello, Matrix!");\n  }\n}\n' },

let AVAIL = new Set(); // compiler names that Wandbox actually has

async function fetchWandboxList() {
  try {
    const r = await fetch('https://wandbox.org/api/list.json');
    const list = await r.json();
    list.forEach(c => AVAIL.add(c.name));
    console.log('[MatrixCode] Wandbox compilers available:', AVAIL.size);
  } catch(e) {
    console.warn('[MatrixCode] Could not fetch Wandbox list; proceeding anyway', e);
  }
  buildLangPanel();
  buildQuickSelect();
}
fetchWandboxList();

let tabs = [];

let tc = 0;

// ═══════════════════════════════════════════════════
//  TABS
// ═══════════════════════════════════════════════════
function newTab(entry) {
  const e = entry || currentEntry;
  tc++;
  const tab = { id:tc, entry:e, code:e.tpl, stdin:'' };
  tabs.push(tab);
  activateTab(tc);
  renderTabs();
}

function activateTab(id) {
  if(activeId && editor) {
    const cur = tabs.find(t=>t.id===activeId);
    if(cur){ cur.code = editor.getValue(); cur.stdin = document.getElementById('si').value; }
  }
  activeId = id;
  const tab = tabs.find(t=>t.id===id);
  if(!tab) return;
  currentEntry = tab.entry;
  if(editor){
    editor.setValue(tab.code||'');
    monaco.editor.setModelLanguage(editor.getModel(), tab.entry.mono);
    document.getElementById('si').value = tab.stdin||'';
  }
  highlightPanel(tab.entry.compiler+'_'+tab.entry.name);
  syncQS(tab.entry);
  renderTabs();
  document.getElementById('sb-lang').textContent = tab.entry.icon+' '+tab.entry.name;
}

function closeTab(id) {
  tabs = tabs.filter(t=>t.id!==id);
  if(tabs.length===0){ newTab(); return; }
  if(activeId===id) activateTab(tabs[tabs.length-1].id);
  renderTabs();
}

function renderTabs() {
  const bar = document.getElementById('tb');
  const ntb = document.getElementById('ntb');
  bar.querySelectorAll('.tab').forEach(el=>el.remove());
  tabs.forEach(tab=>{
    const el = document.createElement('div');
    el.className = 'tab'+(tab.id===activeId?' on':'');
    el.innerHTML = `<span>${tab.entry.icon} ${tab.entry.name}</span><span class="tab-x" data-id="${tab.id}">✕</span>`;
    el.addEventListener('click', e=>{
      if(e.target.classList.contains('tab-x')){ closeTab(+e.target.dataset.id); return; }
      activateTab(tab.id);
    });
    bar.insertBefore(el, ntb);
  });
}

// ═══════════════════════════════════════════════════
//  LANGUAGE PANEL  (built after Wandbox list fetched)
// ═══════════════════════════════════════════════════
function buildLangPanel() {
  const ll = document.getElementById('ll');
  ll.innerHTML = '';
  const cats = [...new Set(CATALOG.map(e=>e.cat))];
  let visible = 0;
  cats.forEach(cat=>{
    const items = CATALOG.filter(e=>e.cat===cat);
    if(!items.length) return;
    const ch = document.createElement('div');
    ch.className = 'cat'; ch.textContent = cat;
    ll.appendChild(ch);
    items.forEach(entry=>{
      const avail = AVAIL.size===0 || AVAIL.has(entry.compiler);
      const el = document.createElement('div');
      el.className = 'li';
      el.dataset.key = entry.compiler+'_'+entry.name;
      el.innerHTML = `<span class="li-ico">${entry.icon}</span>
        <span>${entry.name}</span>
        <span class="li-ver">${entry.compiler.replace('-head','')}</span>
        ${!avail?'<span class="li-badge" style="color:var(--red);border-color:var(--red)">N/A</span>':''}`;
      el.addEventListener('click', ()=>switchEntry(entry));
      ll.appendChild(el);
      visible++;
    });
  });
  document.getElementById('lc').textContent = visible+' langs';
}

function searchPanel(q) {
  q = q.toLowerCase();
  document.getElementById('ll').querySelectorAll('.li').forEach(el=>{
    const txt = el.textContent.toLowerCase();
    el.style.display = txt.includes(q) ? '' : 'none';
  });
  document.getElementById('ll').querySelectorAll('.cat').forEach(cat=>{
    // hide category if all its siblings are hidden
    let next = cat.nextElementSibling;
    let anyVisible = false;
    while(next && !next.classList.contains('cat')){
      if(next.style.display!=='none') anyVisible = true;
      next = next.nextElementSibling;
    }
    cat.style.display = anyVisible ? '' : 'none';
  });
}

function highlightPanel(key) {
  document.querySelectorAll('.li').forEach(el=>{
    el.classList.toggle('on', el.dataset.key===key);
  });
}

function switchEntry(entry) {
  const cur = tabs.find(t=>t.id===activeId);
  if(cur){
    cur.code = editor.getValue();
    // reset to template only if code is pristine
    if(cur.code.trim() === (cur.entry.tpl||'').trim()) cur.code = entry.tpl;
    cur.entry = entry;
    cur.code = cur.code; // keep existing
  }
  currentEntry = entry;
  if(editor){
    if(cur && cur.code.trim() === (entry.tpl||'').trim()) editor.setValue(entry.tpl);
    // else keep editor content
    monaco.editor.setModelLanguage(editor.getModel(), entry.mono);
  }
  highlightPanel(entry.compiler+'_'+entry.name);
  syncQS(entry);
  renderTabs();
  document.getElementById('sb-lang').textContent = entry.icon+' '+entry.name;
}

// ═══════════════════════════════════════════════════

// ═══════════════════════════════════════════════════
function buildQuickSelect() {
  const qs = document.getElementById('qs');
  qs.innerHTML = '';
  const cats = [...new Set(CATALOG.map(e=>e.cat))];
  cats.forEach(cat=>{
    const og = document.createElement('optgroup');
    og.label = '── '+cat;
    CATALOG.filter(e=>e.cat===cat).forEach(e=>{
      const o = document.createElement('option');
      o.value = e.compiler+'_'+e.name;
      o.textContent = e.icon+' '+e.name;
      og.appendChild(o);
    });
    qs.appendChild(og);
  });
  qs.addEventListener('change', ()=>{
    const key = qs.value;
    const entry = CATALOG.find(e=>e.compiler+'_'+e.name===key);
    if(entry) switchEntry(entry);
  });
}

function syncQS(entry) {
  document.getElementById('qs').value = entry.compiler+'_'+entry.name;
}

// ═══════════════════════════════════════════════════
//  RUN CODE  via Wandbox (100% free, no key)
// ═══════════════════════════════════════════════════
async function runCode() {
  if(!editor) return;

  const code   = editor.getValue().trim();
  const stdin  = document.getElementById('si').value;
  const entry  = currentEntry;

  if(!code){ toast('Write some code first!','w'); return; }

  setRunning(true);
  setStatus('run','RUNNING…');
  clearOut();

  try {
    const body = {
      compiler: entry.compiler,
      code,
      stdin,
      'compiler-option-raw': (entry.opts||[]).join('\n'),
      save: false,
    };

    const r = await fetch('https://wandbox.org/api/compile.json',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(body),
    });

    if(!r.ok){ throw new Error(`Wandbox returned ${r.status} ${r.statusText}`); }

    const d = await r.json();
    renderResult(d, entry);
  } catch(err) {
    setStatus('err','ERROR');
    document.getElementById('po-err').textContent = '❌ '+err.message;
    switchPane('err');
    toast('❌ '+err.message,'e');
  } finally {
    setRunning(false);
  }
}

function renderResult(d, entry) {
  // Wandbox fields: program_output, compiler_error, compiler_message, program_error, status, signal
  const stdout  = (d.program_output  || '').trimEnd();
  const stderr  = (d.program_error   || '').trimEnd();
  const cErr    = (d.compiler_error  || '').trimEnd();
  const cOut    = (d.compiler_output || '').trimEnd();
  const exit    = d.status ?? '—';
  const signal  = d.signal || '—';
  const ok      = exit === '0' || exit === 0;

  document.getElementById('po-out').innerHTML = stdout
    ? esc(stdout)
    : '<span class="empty-hint">// (no stdout)</span>';

  const errTxt = [stderr, cErr].filter(Boolean).join('\n\n');
  document.getElementById('po-err').innerHTML = errTxt
    ? `<span style="color:var(--red)">${esc(errTxt)}</span>`
    : '<span class="empty-hint">// (no stderr)</span>';

  document.getElementById('po-inf').innerHTML =
    `<span style="color:var(--dim)">Compiler:</span> ${esc(entry.compiler)}\n`+
    `<span style="color:var(--dim)">Exit status:</span> <span style="color:${ok?'var(--g)':'var(--red)'}">${exit}</span>\n`+
    `<span style="color:var(--dim)">Signal:</span> ${signal}\n`+
    (cOut ? `<span style="color:var(--dim)">Compiler output:</span>\n${esc(cOut)}\n` : '')+
    `<span style="color:var(--dim)">Backend:</span> Wandbox (wandbox.org) — Free, No Key Required\n`;

  document.getElementById('sr').style.display='flex';
  document.getElementById('sx').textContent = exit;
  document.getElementById('ss').textContent = signal;

  if(ok){
    setStatus('ok','DONE ✓');
    switchPane('out');
  } else if(errTxt){
    setStatus('err', exit==='0'?'DONE':'ERROR (exit '+exit+')');
    switchPane('err');
  } else {
    setStatus('err','EXIT '+exit);
    switchPane('out');
  }
}

function clearOut(){
  ['out','err','inf'].forEach(p=>document.getElementById('po-'+p).innerHTML='<span class="empty-hint">// running…</span>');
  document.getElementById('sr').style.display='none';
}

// ═══════════════════════════════════════════════════
//  UI HELPERS
// ═══════════════════════════════════════════════════
function setRunning(on) {
  const btn=document.getElementById('runBtn');
  const ri=document.getElementById('ri');
  const rt=document.getElementById('rt');
  btn.disabled=on;
  ri.innerHTML = on ? '<span class="sp"></span>' : '▶';

function setStatus(cls, msg){
  document.getElementById('dot').className='dot '+(cls==='ok'?'ok':cls==='err'?'err':'run');
  document.getElementById('stxt').textContent=msg;
}

document.querySelectorAll('.ot').forEach(t=>t.addEventListener('click',()=>switchPane(t.dataset.p)));
function switchPane(p){
  document.querySelectorAll('.ot').forEach(t=>t.classList.toggle('on',t.dataset.p===p));
  document.querySelectorAll('.opane').forEach(el=>el.classList.toggle('on',el.id==='po-'+p));
}

let toastTimer;
function toast(msg,type){
  const el=document.getElementById('toast');
  const colors={e:'var(--red)',w:'#ffb347',g:'var(--g)'};
  const c=colors[type]||colors.g;
  el.textContent=msg;
  el.style.cssText=`background:var(--bg3);border:1px solid ${c};color:${c};box-shadow:0 0 16px ${c}33`;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),3200);
}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ═══════════════════════════════════════════════════
//  SAVE / DOWNLOAD
// ═══════════════════════════════════════════════════
function saveCode(){
  if(!editor) return;
  // capture current
  const cur = tabs.find(t=>t.id===activeId);
  if(cur){ cur.code=editor.getValue(); cur.stdin=document.getElementById('si').value; }
  localStorage.setItem('mc_tabs', JSON.stringify(tabs.map(t=>({
    id:t.id, entryName:t.entry.name, entryComp:t.entry.compiler,
    code:t.code, stdin:t.stdin
  }))));
  localStorage.setItem('mc_active', activeId);
  toast('💾 All tabs saved!');
}

function restoreTabs(){
  const raw = localStorage.getItem('mc_tabs');
  if(!raw) return false;
  try {
    const arr = JSON.parse(raw);
    if(!arr.length) return false;
    const actId = +( localStorage.getItem('mc_active')||0 );
    tabs = arr.map(t=>{
      const entry = CATALOG.find(e=>e.name===t.entryName && e.compiler===t.entryComp) || CATALOG[0];
      return { id:t.id, entry, code:t.code||entry.tpl, stdin:t.stdin||'' };
    });
    tc = Math.max(...tabs.map(t=>t.id));
    const toAct = tabs.find(t=>t.id===actId)||tabs[tabs.length-1];
    activateTab(toAct.id);
    return true;
  } catch(e){ return false; }
}

function downloadCode(){
  if(!editor) return;
  const code = editor.getValue();
  const entry = currentEntry;
  const fname = 'code.'+entry.ext;
  const blob = new Blob([code],{type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url; a.download=fname; a.click();
  URL.revokeObjectURL(url);
  toast('⬇ Downloaded as '+fname);
}

// ═══════════════════════════════════════════════════
//  RESIZERS
// ═══════════════════════════════════════════════════
function makeResizer(handle, getEl, side){
  let down=false,sx=0,sw=0;
  handle.addEventListener('mousedown',e=>{
    down=true; sx=e.clientX; sw=getEl().offsetWidth;
    handle.classList.add('drag');
    document.body.style.cssText='cursor:col-resize;user-select:none';
  });
  document.addEventListener('mousemove',e=>{
    if(!down) return;
    const dx=e.clientX-sx;
    const nw=Math.max(160,Math.min(600,sw+(side==='l'?dx:-dx)));
    getEl().style.width=nw+'px';
    getEl().style.flex='none';
  });
  document.addEventListener('mouseup',()=>{
    if(down){ down=false; handle.classList.remove('drag'); document.body.style.cssText=''; }
  });
}

makeResizer(document.getElementById('rzR'), ()=>document.getElementById('op'), 'r');
